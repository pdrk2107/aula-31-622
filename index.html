<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Desenvolvimento Web</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="formulario">

            <h1>Cadastro</h1>
            <p>Preencha os dados abaixo para realizar seu cadastro.</p>

            <form id="cadastroForm">

                <div class="campo">
                    <label for="nome">Nome Completo</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome completo"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail Institucional</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha de Acesso</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        minlength="6"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="confirmaSenha">Confirmação de Senha</label>
                    <input
                        type="password"
                        id="confirmaSenha"
                        placeholder="Digite a senha novamente"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="perfil">Perfil Técnico</label>

                    <select id="perfil" required>
                        <option value="">Selecione uma área</option>
                        <option value="Redes">Redes</option>
                        <option value="Desenvolvimento">Desenvolvimento</option>
                        <option value="Suporte">Suporte</option>
                    </select>
                </div>

                <div class="termos">
                    <input type="checkbox" id="termos" required>
                    <label for="termos">
                        Aceito os Termos de Uso
                    </label>
                </div>

                <p id="mensagem"></p>

                <button type="submit">Cadastrar</button>

            </form>

        </div>

        <div class="saida">

            <h2>Dados Cadastrados</h2>

            <div class="resultado">

                <p>
                    <strong>Nome:</strong>
                    <span id="saidaNome">---</span>
                </p>

                <p>
                    <strong>E-mail:</strong>
                    <span id="saidaEmail">---</span>
                </p>

                <p>
                    <strong>Perfil:</strong>
                    <span id="saidaPerfil">---</span>
                </p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
